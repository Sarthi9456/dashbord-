services:
  - type: web
    name: rbac-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      # Render does not offer a free managed MySQL database, so these must
      # point at an external MySQL host (e.g. Railway, Aiven, Clever Cloud,
      # PlanetScale). Set these manually in the Render dashboard's
      # Environment tab after the first deploy — see README for details.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
